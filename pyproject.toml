[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastcmb"
version = "0.2.0"
description = "An online emulator of Boltzmann codes: CMB spectra in milliseconds, with the code as the fallback."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Salih Yeşil" }]
dependencies = [
    "numpy>=2.0",
    "scipy",
]

[project.optional-dependencies]
camb = ["camb>=1.5"]
cobaya = ["cobaya>=3.5", "camb>=1.5"]
dev = ["pytest", "camb>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
